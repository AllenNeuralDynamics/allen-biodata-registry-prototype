  /agent/chat:
    post:
      operationId: agentChat
      tags:
      - agent
      summary: Forward a conversation turn to the Metadata Agent.
      description: "AgentCore streams responses in production; for OpenAPI\ncompatibility the spec models the response as plain JSON.\nStreaming clients negotiate `Accept: text/event-stream` and\nreceive\
        \ an SSE stream from the Lambda \u2014 this is documented\nas a vendor extension here rather than via OpenAPI's limited\nstreaming support.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
