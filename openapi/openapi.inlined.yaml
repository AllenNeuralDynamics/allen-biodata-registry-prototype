        `INVALID_HIERARCHY` with `details: {cycle_path: [...]}`

        (R12.3, R13.3).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - child_id
              properties:
                child_id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Child added.
        '400':
          $ref: '#/components/responses/InvalidHierarchy'
