# Test/dev tooling for the Sample-Data Seeder Lambda.
#
# This project file exists primarily to (a) declare the test
# dependencies, (b) configure pytest's discovery/coverage/strictness
# defaults, and (c) make the package importable as `handler`,
# `seeder`, and `mapping` when run from anywhere.
#
# At runtime (Lambda execution), `requirements.txt` is the source of
# truth. Terraform packages handler.py + seeder.py + mapping.py + the
# runtime deps from `requirements.txt` into a deployment zip —
# pyproject.toml plays no role in the live image.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodata-registry-seeder"
version = "0.1.0"
description = "Sample-data seeder Lambda for the Allen BioData Registry PoC."
requires-python = ">=3.12"

# Runtime deps mirror requirements.txt; boto3 is pulled in for tests
# even though Lambda provides it at runtime.
dependencies = [
    "pg8000>=1.30.0,<2.0.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
]
