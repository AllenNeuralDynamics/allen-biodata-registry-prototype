# Test/dev tooling for the API Gateway Authorizer Lambda.
#
# This project file declares test dependencies and pytest defaults. At
# runtime (Lambda execution), `requirements.txt` is the source of truth
# — Terraform packages the code + the runtime deps from
# `requirements.txt` into a deployment zip; pyproject.toml plays no
# role in the live image.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodata-registry-authorizer"
version = "0.1.0"
description = "API Gateway Lambda Authorizer for the Allen BioData Registry PoC."
requires-python = ">=3.12"

dependencies = [
    "PyJWT>=2.8.0,<3.0.0",
    "cryptography>=42.0.0,<46.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # PyJWT emits a DeprecationWarning when unverified options are
    # used; we keep `error` strict for our own warnings but allow
    # PyJWT's internal warnings during tests.
    "ignore::DeprecationWarning:jwt",
]
